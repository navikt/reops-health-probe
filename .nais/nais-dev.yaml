apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: reops-health-probe
  namespace: team-researchops
  labels:
    team: team-researchops
spec:
  image: "{{ image }}"
  port: 8080
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: "50m"
      memory: 128Mi
  gcp:
    permissions:
      - resource:
          apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
          kind: Project
        role: roles/bigquery.dataViewer
  accessPolicy:
    outbound:
      external:
        - host: hooks.slack.com
  envFrom:
    - secret: reops-health-probe
